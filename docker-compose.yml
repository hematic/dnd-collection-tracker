# D&D Collection Tracker behind an authenticating reverse proxy (e.g. Traefik + TinyAuth/Authelia).
# The proxy must send Remote-User/Remote-Email after login and drop any the client sends.
# Komodo: put the variables from .env.example in the Stack environment; leave Run Build off.
# Plain Docker: copy .env.example to .env, then run docker compose up -d.
x-image: &tracker-image
  image: ${DND_TRACKER_IMAGE:-hematic/dnd-collection-tracker:latest}
  user: "${PUID:-1000}:${PGID:-1000}"
  # Hardening. The app writes only to /data and /tmp (cover uploads over 1 MB and the
  # worker's health check file), needs no Linux capabilities, and never escalates.
  read_only: true
  tmpfs:
    - /tmp:noexec,nosuid,nodev,size=64m
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  # Rotate logs. Remove this block if your Docker daemon ships logs elsewhere (Loki, journald).
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  dnd-tracker:
    <<: *tracker-image
    container_name: dnd-tracker
    restart: unless-stopped
    environment:
      DND_TRACKER_DATA: /data
      DND_TRACKER_PDF_ROOT: /pdfs
      DND_TRACKER_PDF_MAP: ${DND_TRACKER_PDF_MAP:-}
      DND_TRACKER_ADMINS: ${DND_TRACKER_ADMINS:?set DND_TRACKER_ADMINS in .env}
      # Only the proxy may talk to the app: the published port is reachable from the LAN, and
      # the proxy is what enforces the login and strips forged Remote-* headers.
      DND_TRACKER_TRUSTED_PROXIES: ${TRAEFIK_IP:?set TRAEFIK_IP to the proxy IP}
    cpu_shares: ${DND_TRACKER_CPU_SHARES:-1024}
    volumes:
      # Database + covers: an absolute folder on the server's local disk, outside the
      # repo checkout so redeploys/re-clones can never touch it. (SQLite and network shares don't mix.)
      - ${DND_DATA_DIR:?set DND_DATA_DIR to an absolute path, e.g. /opt/appdata/dnd-tracker}:/data
      # The PDF library, already mounted on the host, read-only.
      - ${DND_PDF_DIR:-/mnt/dnd/Books}:/pdfs:ro
    ports:
      - "${DND_PORT:-8765}:8000"
    # Health checks for both services come from the image (Dockerfile HEALTHCHECK).

  dnd-tracker-ocr:
    <<: *tracker-image
    container_name: dnd-tracker-ocr
    restart: unless-stopped
    command: ["python", "-m", "app.pdf_worker"]
    environment:
      DND_TRACKER_DATA: /data
      DND_TRACKER_PDF_ROOT: /pdfs
      DND_TRACKER_PDF_MAP: ${DND_TRACKER_PDF_MAP:-}
    cpu_shares: ${DND_OCR_CPU_SHARES:-1024}
    volumes:
      - ${DND_DATA_DIR:?set DND_DATA_DIR to an absolute path, e.g. /opt/appdata/dnd-tracker}:/data
      - ${DND_PDF_DIR:-/mnt/dnd/Books}:/pdfs:ro
    depends_on:
      dnd-tracker:
        condition: service_healthy
    stop_grace_period: 2m
