name: dnd-tracker-local

x-tracker: &tracker
  image: ${DND_TRACKER_IMAGE:-hematic/dnd-collection-tracker:latest}
  restart: unless-stopped
  environment:
    DND_TRACKER_DATA: /data
    DND_TRACKER_PDF_ROOT: /pdfs
  volumes:
    - tracker-data:/data
    - ${DND_LOCAL_PDF_DIR:-./pdfs}:/pdfs:ro
  # Hardening: the app writes only to /data and /tmp and needs no Linux capabilities.
  read_only: true
  tmpfs:
    - /tmp:noexec,nosuid,nodev,size=64m
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  dnd-tracker:
    <<: *tracker
    ports:
      - "127.0.0.1:${DND_LOCAL_PORT:-8765}:8000"

  dnd-tracker-ocr:
    <<: *tracker
    command: ["python", "-m", "app.pdf_worker"]
    depends_on:
      dnd-tracker:
        condition: service_healthy
    stop_grace_period: 2m

volumes:
  tracker-data:
