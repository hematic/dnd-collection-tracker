name: dnd-tracker-local

x-tracker: &tracker
  image: ${DND_TRACKER_IMAGE:-hematic/dnd-collection-tracker:latest}
  restart: unless-stopped
  environment:
    DND_TRACKER_DATA: /data
    DND_TRACKER_PDF_ROOT: /pdfs
  volumes:
    - tracker-data:/data
    - ${DND_LOCAL_PDF_DIR:-./pdfs}:/pdfs:ro

services:
  dnd-tracker:
    <<: *tracker
    ports:
      - "127.0.0.1:${DND_LOCAL_PORT:-8765}:8000"

  dnd-tracker-ocr:
    <<: *tracker
    command: ["python", "-m", "app.pdf_worker"]
    depends_on:
      dnd-tracker:
        condition: service_healthy
    stop_grace_period: 2m

volumes:
  tracker-data:
